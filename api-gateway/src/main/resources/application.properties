spring.application.name=api-gateway
server.port=8080

# ── RUTAS ────────────────────────────────────────────────────────────────────

# ms-auth — rutas públicas (login y register no requieren token)
spring.cloud.gateway.server.webflux.routes[0].id=ms-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-auth
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# ms-inventario
spring.cloud.gateway.server.webflux.routes[1].id=ms-inventario
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-inventario
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/inventario/**

# ms-pedidos
spring.cloud.gateway.server.webflux.routes[2].id=ms-pedidos
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ms-pedidos
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/pedidos/**

# ms-notificaciones
spring.cloud.gateway.server.webflux.routes[3].id=ms-notificaciones
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ms-notificaciones
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notificaciones/**

# ms-entrega
spring.cloud.gateway.server.webflux.routes[4].id=ms-entrega
spring.cloud.gateway.server.webflux.routes[4].uri=lb://ms-entrega
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/entregas/**

# ms-proveedores
spring.cloud.gateway.server.webflux.routes[5].id=ms-proveedores
spring.cloud.gateway.server.webflux.routes[5].uri=lb://ms-proveedores
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/proveedores/**

# ms-contratos
spring.cloud.gateway.server.webflux.routes[6].id=ms-contratos
spring.cloud.gateway.server.webflux.routes[6].uri=lb://ms-proveedores
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/contratos/**

# ms-reportes
spring.cloud.gateway.server.webflux.routes[7].id=ms-reportes
spring.cloud.gateway.server.webflux.routes[7].uri=lb://ms-reportes
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/reportes/**

# ms-mantenimiento
spring.cloud.gateway.server.webflux.routes[8].id=ms-mantenimiento
spring.cloud.gateway.server.webflux.routes[8].uri=lb://ms-mantenimiento
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/mantenimiento/**

# ── ACTUATOR ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,gateway,prometheus
management.endpoint.gateway.access=unrestricted
management.endpoint.health.show-details=always
management.observations.key-values.application=${spring.application.name}

# ── JWT ───────────────────────────────────────────────────────────────────────
# Debe ser la misma clave que en ms-auth
jwt.secret=madera-mineria-clave-secreta-2026-cibertec

# ── CORS ─────────────────────────────────────────────────────────────────────
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*

# ── EUREKA CLIENT ─────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.instance.prefer-ip-address=true

# ── LOGGING ──────────────────────────────────────────────────────────────────
logging.level.org.springframework.cloud.gateway=DEBUG
